# Local infrastructure: PostgreSQL, Redis and MinIO (S3-compatible storage).
# Ports follow the architecture doc, section 27.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resume_judge
      POSTGRES_PASSWORD: resume_judge
      POSTGRES_DB: resume_judge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_judge -d resume_judge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The official minio/minio image is no longer published on Docker Hub,
  # so this uses the community-maintained fork with the same CLI and API.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resume_judge
      MINIO_ROOT_PASSWORD: resume_judge_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the uploads bucket once MinIO is up.
  minio-setup:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 resume_judge resume_judge_secret &&
      mc mb --ignore-existing local/resumes
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
